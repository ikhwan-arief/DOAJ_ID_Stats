[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doaj-sinta-observatory-etl"
version = "0.1.0"
description = "Deterministic, privacy-safe ETL foundation for the DOAJ x SINTA Journal Observatory."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
